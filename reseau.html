<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infrastructure réseau virtualisée</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: white; color: black; line-height: 1.6; }
    header { background: #f2f2f2; padding: 40px 20px; text-align: center; border-bottom: 1px solid #ddd; }
    header h1 { margin: 0; font-size: 32px; }
    nav { background: white; padding: 15px; text-align: center; border-bottom: 1px solid #ddd; position: sticky; top: 0; }
    nav a { color: black; margin: 0 15px; text-decoration: none; font-weight: bold; }
    nav a:hover { text-decoration: underline; }
    section { padding: 60px 10%; }
    .card { background: #fafafa; padding: 30px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #e5e5e5; }
    .download { display: inline-block; background: black; color: white; padding: 10px 15px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-right: 10px; margin-top: 10px; }
    .download:hover { opacity: 0.8; }
    footer { background: #f2f2f2; text-align: center; padding: 20px; margin-top: 40px; border-top: 1px solid #ddd; }
    #contenu-projet h1, #contenu-projet h2, #contenu-projet h3 { color: black; }
    #contenu-projet ul { padding-left: 20px; }
  </style>
</head>
<body>

<header>
  <h1><i class="fa-solid fa-network-wired"></i> Infrastructure réseau virtualisée</h1>
  <p>Projet technique – BTS SIO Option SISR</p>
</header>

<nav>
  <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Retour au portfolio</a>
</nav>

<section>
  <div class="card" id="contenu-projet">
    <p>Chargement du projet...</p>
  </div>

  <div class="card">
    <h2><i class="fa-solid fa-file-arrow-down"></i> Documents</h2>
    <a class="download" href="https://raw.githubusercontent.com/diegoakb-web/infra-reseau-virtualisee/main/Cahier_des_charges_MARTINS_CIE.pdf" download target="_blank">
      <i class="fa-solid fa-file-pdf"></i> Cahier des charges
    </a>
    <a class="download" href="https://raw.githubusercontent.com/diegoakb-web/infra-reseau-virtualisee/main/Rapport%20de%20projet.docx" download target="_blank">
      <i class="fa-solid fa-file-word"></i> Rapport de projet
    </a>
  </div>
</section>

<footer>
  <p>Portfolio BTS SIO – 2026</p>
  <p>
    <a href="https://mail.google.com/mail/?view=cm&fs=1&to=kubotadiego@gmail.com" target="_blank" style="color:black; margin:0 10px;">
      <i class="fa-solid fa-envelope"></i> Email
    </a>
    <a href="https://www.linkedin.com/in/diego-kubota-410b15350/" target="_blank" style="color:black; margin:0 10px;">
      <i class="fa-brands fa-linkedin"></i> LinkedIn
    </a>
  </p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script>
  fetch('https://raw.githubusercontent.com/diegoakb-web/infra-reseau-virtualisee/main/projet.md')
    .then(response => response.text())
    .then(text => {
      document.getElementById('contenu-projet').innerHTML = marked.parse(text);
    })
    .catch(() => {
      document.getElementById('contenu-projet').innerHTML = '<p>Impossible de charger le contenu du projet.</p>';
    });
</script>

</body>
</html>
